<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>低保真原型模板</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f5f7; color: #202124; }
    header { padding: 16px 24px; background: #fff; border-bottom: 1px solid #ddd; }
    main { width: min(920px, calc(100% - 32px)); margin: 32px auto; }
    .notice { padding: 12px 16px; background: #fff7d6; border: 1px solid #ecd66d; border-radius: 8px; }
    .card { margin-top: 16px; padding: 24px; background: #fff; border: 1px solid #ddd; border-radius: 10px; }
    button { padding: 10px 16px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <header><strong>REQ-编号｜需求名称</strong></header>
  <main>
    <div class="notice">低保真原型 · 页面内容为假数据</div>
    <section class="card">
      <h1>页面标题</h1>
      <p>在此展示核心流程和交互，不追求视觉还原。</p>
      <button type="button">主要操作</button>
    </section>
  </main>
</body>
</html>
