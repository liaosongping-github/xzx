<!--
  片段 02 · 状态页签 + 快捷查询行（产品资料页）
  权威：2026-09-10 现网实测。依赖 ../app.css。
  - el-tabs：项高 50px，激活主色 + 2px 下划线；计数在文案后（现网采集：草稿5/单个6043/组合20/专属397/全部6460）。
  - 关键字框固定 250px，append 区：字段查询图标按钮 + 竖分隔线 + 精准查询 checkbox（均带 tooltip）。
  - 下拉为自定义 .el-select（readonly input + caret，由 DYJ.bindSelects 渲染下拉面板）。
-->
<div class="white-card page-card">
  <!-- 状态页签 -->
  <div class="el-tabs">
    <div class="el-tabs__header">
      <div class="el-tabs__item">草稿产品 <span class="tab-count">(5)</span></div>
      <div class="el-tabs__item is-active">单个产品 <span class="tab-count">(6043)</span></div>
      <div class="el-tabs__item">组合产品 <span class="tab-count">(20)</span></div>
      <div class="el-tabs__item">客户专属 <span class="tab-count">(397)</span></div>
      <div class="el-tabs__item">全部 <span class="tab-count">(6460)</span></div>
    </div>
  </div>

  <!-- 快捷查询 -->
  <div class="filter-row">
    <span class="kw-search">
      <input placeholder="请输入"/>
      <span class="kw-append">
        <span class="kw-icon" title="字段查询"><!-- 字段查询 SVG --></span>
        <span class="divider"></span>
        <label title="勾选精准查询"><input type="checkbox"/></label>
      </span>
    </span>

    <span class="el-select" data-options="全部,有图,无图">
      <span class="el-input__wrapper"><input class="el-input__inner" value="全部" readonly/><span class="el-select__caret">▾</span></span>
    </span>
    <span class="el-select" data-options="全部,未停产,停产">
      <span class="el-input__wrapper"><input class="el-input__inner" value="全部" readonly/><span class="el-select__caret">▾</span></span>
    </span>
    <span>产品状态：
      <span class="el-select" data-options="上架,下架,全部">
        <span class="el-input__wrapper"><input class="el-input__inner" value="上架" readonly/><span class="el-select__caret">▾</span></span>
      </span>
    </span>

    <button class="el-button el-button--primary">查询</button>
    <button class="el-button">综合查询</button><!-- 打开右侧 850px 抽屉，见片段 06 -->
    <button class="el-button">图搜</button><!-- 打开图搜浮层，见片段 08 -->
  </div>
</div>
