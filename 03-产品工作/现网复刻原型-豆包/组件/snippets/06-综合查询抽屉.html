<!--
  片段 06 · 综合查询右侧抽屉（产品资料）
  权威：2026-09-10 现网实测（宽 850px，分组：基础信息 / 产品参数 / 厂商信息 / 其他信息）。
  依赖 ../app.css；两列栅格 .drawer-grid；分组标题为加粗冒号标题（抽屉内无蓝色竖条）。
  尺寸区间：长/宽/高各一对 min-max 输入，每对后跟 cm，单行排开（输入 38px）。
  底部固定：重置 / 确定（主按钮）。
  完整字段清单以现网采集 output/layer-advQuery.json 为准。
-->
<div class="el-drawer-mask" id="advDrawerMask" data-for="advDrawer"></div>
<aside class="el-drawer" id="advDrawer" style="width:850px">
  <div class="el-drawer__header">×<span style="margin-left:2px">综合查询</span>
    <button class="el-drawer__close" data-close-drawer="advDrawer">×</button>
  </div>
  <div class="el-drawer__body">
    <div class="drawer-grid">
      <div class="form-section-title">基础信息：</div>
      <div class="el-form-item"><label class="el-form-item__label">产品名称：</label><div class="el-form-item__content"><span class="el-input__wrapper"><input class="el-input__inner" placeholder="输入关键词+空格分隔可多关键词匹配"/></span></div></div>
      <div class="el-form-item"><label class="el-form-item__label">出厂货号：</label><div class="el-form-item__content"><span class="el-input__wrapper"><input class="el-input__inner" placeholder="多货号查询以&quot;,&quot;隔开"/></span></div></div>
      <div class="el-form-item"><label class="el-form-item__label">产品编号：</label><div class="el-form-item__content"><span class="el-input__wrapper"><input class="el-input__inner" placeholder="多编号查询以&quot;,&quot;隔开"/></span></div></div>
      <div class="el-form-item"><label class="el-form-item__label">产品单位：</label><div class="el-form-item__content"><span class="el-select" data-options="请选择"><span class="el-input__wrapper"><input class="el-input__inner" placeholder="请选择" readonly/><span class="el-select__caret">▾</span></span></span></div></div>
      <div class="el-form-item"><label class="el-form-item__label">出厂价：</label><div class="el-form-item__content">
        <span class="range-input"><span class="el-input__wrapper"><input class="el-input__inner" placeholder="最低"/></span><span>-</span><span class="el-input__wrapper"><input class="el-input__inner" placeholder="最高"/></span></span>
      </div></div>
      <div class="el-form-item"><label class="el-form-item__label">进货价：</label><div class="el-form-item__content">
        <span class="range-input"><span class="el-input__wrapper"><input class="el-input__inner" placeholder="最低"/></span><span>-</span><span class="el-input__wrapper"><input class="el-input__inner" placeholder="最高"/></span></span>
      </div></div>

      <div class="form-section-title">产品参数：</div>
      <div class="el-form-item"><label class="el-form-item__label">外箱装量：</label><div class="el-form-item__content">
        <span class="range-input"><span class="el-input__wrapper"><input class="el-input__inner" placeholder="最低"/></span><span>-</span><span class="el-input__wrapper"><input class="el-input__inner" placeholder="最高"/></span></span>
      </div></div>
      <div class="el-form-item"><label class="el-form-item__label">中文包装：</label><div class="el-form-item__content"><span class="el-input__wrapper"><input class="el-input__inner" placeholder="请输入"/></span></div></div>
      <div class="el-form-item"><label class="el-form-item__label">产品规格：</label><div class="el-form-item__content">
        <span class="size-range">
          <span class="el-input__wrapper"><input class="el-input__inner" value="0"/></span><span class="sr-sep">-</span><span class="el-input__wrapper"><input class="el-input__inner" value="0"/></span><span class="sr-unit">cm</span>
          <span class="el-input__wrapper"><input class="el-input__inner" value="0"/></span><span class="sr-sep">-</span><span class="el-input__wrapper"><input class="el-input__inner" value="0"/></span><span class="sr-unit">cm</span>
          <span class="el-input__wrapper"><input class="el-input__inner" value="0"/></span><span class="sr-sep">-</span><span class="el-input__wrapper"><input class="el-input__inner" value="0"/></span><span class="sr-unit">cm</span>
        </span>
      </div></div>
      <div class="el-form-item"><label class="el-form-item__label">包装规格：</label><div class="el-form-item__content">
        <span class="size-range">
          <span class="el-input__wrapper"><input class="el-input__inner" value="0"/></span><span class="sr-sep">-</span><span class="el-input__wrapper"><input class="el-input__inner" value="0"/></span><span class="sr-unit">cm</span>
          <span class="el-input__wrapper"><input class="el-input__inner" value="0"/></span><span class="sr-sep">-</span><span class="el-input__wrapper"><input class="el-input__inner" value="0"/></span><span class="sr-unit">cm</span>
          <span class="el-input__wrapper"><input class="el-input__inner" value="0"/></span><span class="sr-sep">-</span><span class="el-input__wrapper"><input class="el-input__inner" value="0"/></span><span class="sr-unit">cm</span>
        </span>
      </div></div>

      <div class="form-section-title">厂商信息：</div>
      <div class="el-form-item"><label class="el-form-item__label">厂商编号：</label><div class="el-form-item__content"><span class="el-input__wrapper"><input class="el-input__inner" placeholder="请输入"/></span></div></div>
      <div class="el-form-item"><label class="el-form-item__label">厂商名称：</label><div class="el-form-item__content"><span class="el-input__wrapper"><input class="el-input__inner" placeholder="请输入"/></span></div></div>

      <div class="form-section-title">其他信息：</div>
      <div class="el-form-item"><label class="el-form-item__label">侵权：</label><div class="el-form-item__content"><span class="el-select" data-options="全部,是,否"><span class="el-input__wrapper"><input class="el-input__inner" value="全部" readonly/><span class="el-select__caret">▾</span></span></span></div></div>
      <div class="el-form-item"><label class="el-form-item__label">13条形码：</label><div class="el-form-item__content"><span class="el-input__wrapper"><input class="el-input__inner" placeholder="请输入"/></span></div></div>
      <!-- 其余字段：是否在展/停产/GCC/热销/实样/中英文备注/注意事项/功能说明/登记与修改人时间等，同构 -->
    </div>
  </div>
  <div class="el-drawer__footer">
    <button class="el-button">重置</button>
    <button class="el-button el-button--primary">确定</button>
  </div>
</aside>
