<!--
  片段 09 · 列设置抽屉（宽 710px）
  权威：2026-09-10 现网实测。依赖 ../app.css。
  - 标题「勾选您要显示的字段」；顶部操作：设置全部显示 / 排序整理 / 恢复系统默认 + 右侧搜索框 + 查询；
  - chip 四列栅格：已显示=主色蓝底白字（眼睛 + 拖拽柄），未显示=灰底灰字；点击眼睛切换显隐，拖拽柄用于排序；
  - 全集 61 个字段（顺序照现网 output/cap6-columns.json），默认显示 13 列；
  - 底部：关闭 / 保存。注意：表格默认列含「自定义价格」，但现网 chip 全集中无该项，已在待确认登记。
-->
<div class="el-drawer-mask" id="colDrawerMask" data-for="colDrawer"></div>
<aside class="el-drawer" id="colDrawer" style="width:710px">
  <div class="el-drawer__header">×<span style="margin-left:2px">勾选您要显示的字段</span>
    <button class="el-drawer__close" data-close-drawer="colDrawer">×</button>
  </div>
  <div class="el-drawer__body">
    <div class="colset-toolbar">
      <button class="el-button is-sm">设置全部显示</button>
      <button class="el-button is-sm">排序整理</button>
      <button class="el-button is-sm">恢复系统默认</button>
      <span class="ml-auto flex-c gap8">
        <span class="el-input__wrapper" style="width:180px"><input class="el-input__inner" placeholder="请输入"/></span>
        <button class="el-button el-button--primary is-sm">查询</button>
      </span>
    </div>
    <div class="colset-chips">
      <!-- 已显示：is-off 缺省；未显示加 is-off -->
      <span class="col-chip"><span class="cc-eye"><!--眼睛 SVG--></span>产品图片<span class="cc-drag">⠿</span></span>
      <span class="col-chip"><span class="cc-eye"></span>产品编号<span class="cc-drag">⠿</span></span>
      <span class="col-chip is-off"><span class="cc-eye"></span>起订量<span class="cc-drag">⠿</span></span>
      <span class="col-chip is-off"><span class="cc-eye"></span>产品状态<span class="cc-drag">⠿</span></span>
      <!-- …共 61 项：辅助编号/产品名称/英文名称/出厂货号/产品类型/出厂价/进货价/自定义价格/第三方价格/
           采购折扣/标贴费/分类编号/分类名称/中文包装/英文包装/中文材质/英文材质/产品单位/英文单位/产品颜色/
           英文颜色/产品认证/产品品牌/工厂条码/公司条码/暗码/产品规格/包装规格/内盒规格/外箱规格/体积材积/
           外箱毛净重/产品毛净重/内盒个数/外箱装量/厂商名称/厂商编号/联系人/联系电话/联系手机/QQ/摊位号/
           热销/在展产品数/停产/GCC/实样/侵权/是否有视频/是否有图/中文备注/英文备注/注意事项/功能说明/
           其他/登记人/登记时间/图片修改人/图片修改时间/修改人/修改时间/下架时间 -->
    </div>
  </div>
  <div class="el-drawer__footer">
    <button class="el-button" data-close-drawer="colDrawer">关闭</button>
    <button class="el-button el-button--primary">保存</button>
  </div>
</aside>
