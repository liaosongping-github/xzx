<!--
  片段 04 · 数据表格（vxe-table 风格）
  权威：2026-09-10 现网实测。依赖 ../app.css。
  - 表头 40px / 700 / #333 / 14px；表体行高 40px / 14px；行 hover 浅蓝；数字列右对齐；图片列居中。
  - 首列序号、次列勾选（表头 checkbox 旁带小三角用于全选/反选），操作列固定右侧（sticky + 左投影）。
  - 产品编号为蓝色链接；图片为灰底占位（演示原型禁止下载真实产品图）。
  - 行操作：编辑（蓝链接）/ 删除（红链接）/ 更多（默认链接，弹行菜单：
    客户产品、加入选品车、留痕记录、货柜箱、尺计算）。
-->
<div class="table-wrap">
  <table class="dyj-table">
    <thead>
      <tr>
        <th style="min-width:56px" class="col-center">序号</th>
        <th style="min-width:44px" class="col-center"><input type="checkbox" id="headCheck"/><span class="th-caret">▾</span></th>
        <th style="min-width:80px" class="col-center">产品图片</th>
        <th style="min-width:140px">产品编号</th>
        <th style="min-width:90px">辅助编号</th>
        <th style="min-width:150px">产品名称</th>
        <th style="min-width:150px">英文名称</th>
        <th style="min-width:110px">出厂货号</th>
        <th style="min-width:90px">产品类型</th>
        <th class="col-num">出厂价</th>
        <th class="col-num">进货价</th>
        <th class="col-num">自定义价格</th>
        <th class="col-num">第三方价格</th>
        <th class="col-num">采购折扣</th>
        <th class="col-num">标贴费</th>
        <th style="min-width:150px" class="col-fixed-right">操作</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="col-center">1</td>
        <td class="col-center"><input type="checkbox" class="row-check"/></td>
        <td class="col-center"><span class="prod-img is-empty">图</span></td>
        <td><a class="el-link el-link--primary">DY0000060821993</a></td>
        <td>A-01</td>
        <td>1:16 遥控越野车（红）</td>
        <td>1:16 RC OFF-ROAD CAR RED</td>
        <td>RC1601-R</td>
        <td>单个产品</td>
        <td class="col-num">25.5</td>
        <td class="col-num">21.0</td>
        <td class="col-num">27.0</td>
        <td class="col-num">—</td>
        <td class="col-num">—</td>
        <td class="col-num">—</td>
        <td class="col-fixed-right">
          <span class="row-actions">
            <button class="el-button is-link el-button--primary">编辑</button>
            <button class="el-button is-link el-button--danger">删除</button>
            <button class="el-button is-link el-button--default">更多</button>
          </span>
        </td>
      </tr>
      <!-- 更多行同构；空数据：<tr><td colspan="N" class="empty-cell">暂无数据</td></tr> -->
    </tbody>
  </table>
</div>
