<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>导入产品 · 双引鲸贸易端复刻原型</title>
<link rel="stylesheet" href="../../组件/app.css"/>
<style>
  .import-card { padding: 14px 16px; display: flex; flex-direction: column; min-height: calc(100vh - 60px - 40px - 30px); }
  .import-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-bottom: 12px; }
  .import-toolbar .el-button.is-warn { background: #ff8f1f; border-color: #ff8f1f; color: #fff; }
  .import-toolbar .el-button.is-warn:hover { background: #ffa340; border-color: #ffa340; }
  .err-link { margin-left: auto; color: var(--dyj-primary); font-size: 14px; cursor: pointer; }
  .import-table-wrap { flex: 1; border: 1px solid var(--dyj-border-light); border-radius: 4px; overflow: auto; min-height: 320px; }
  .dyj-table .empty-cell { height: 320px; text-align: center; color: #a8abb2; font-size: 14px; }
  .import-footer { display: flex; align-items: center; gap: 14px; padding-top: 14px; flex-wrap: wrap; }
  .check-line { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; flex: 1; font-size: 13px; color: #606266; }
  .check-line label { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; cursor: pointer; }
  .check-line input { accent-color: var(--dyj-primary); }
  .import-setting { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #333; }
  .import-setting .el-select .el-input__wrapper { min-width: 260px; }
  .footer-actions { display: flex; gap: 10px; }
</style>
</head>
<body>
<div id="page-content">
  <div class="white-card import-card">

    <!-- 工具条（现网实测顺序） -->
    <div class="import-toolbar">
      <button class="el-button el-button--success" id="impDownload">下载Excel</button>
      <button class="el-button is-warn" id="impUpload">上传Excel</button>
      <button class="el-button" id="impDel">批量删除</button>
      <button class="el-button" id="impEdit">批量修改字段</button>
      <button class="el-button" id="impDiscount">一键引用厂商采购折扣</button>
      <button class="el-button" id="impRevert">批量还原修改</button>
      <label style="display:inline-flex;align-items:center;gap:6px;font-size:14px;color:#606266;cursor:pointer">
        <input type="checkbox"/>仅显示失败项
      </label>
      <span class="err-link" id="impErr">导出错误记录&gt;</span>
    </div>

    <!-- 空表（14 列，现网实测列序） -->
    <div class="import-table-wrap">
      <table class="dyj-table">
        <thead>
          <tr>
            <th style="min-width:56px">序号</th>
            <th style="min-width:80px">产品图片</th>
            <th style="min-width:100px">厂商编号</th>
            <th style="min-width:130px">产品编号</th>
            <th style="min-width:150px">产品名称</th>
            <th style="min-width:150px">产品英文名称</th>
            <th style="min-width:110px">出厂货号</th>
            <th style="min-width:90px">出厂价</th>
            <th style="min-width:90px">进货价</th>
            <th style="min-width:100px">第三方价格</th>
            <th style="min-width:90px">采购折扣</th>
            <th style="min-width:90px">标贴费</th>
            <th style="min-width:100px">导入状态</th>
            <th style="min-width:90px">操作</th>
          </tr>
        </thead>
        <tbody>
          <tr><td class="empty-cell" colspan="14">暂无数据</td></tr>
        </tbody>
      </table>
    </div>

    <!-- 底部：综合校验 + 导入设置 + 操作 -->
    <div class="import-footer">
      <button class="el-button" id="impValidate">综合校验</button>
      <div class="check-line">
        <label><input type="checkbox" checked/>校验内盒小于装箱量</label>
        <label><input type="checkbox" checked/>校验净重小于毛重</label>
        <label><input type="checkbox" checked/>校验侵权</label>
        <label><input type="checkbox" checked/>出厂货号必填</label>
        <label><input type="checkbox" checked/>出厂价大于0</label>
        <label><input type="checkbox" checked/>装箱量大于0</label>
        <label><input type="checkbox" checked/>包装方式必填</label>
      </div>
    </div>
    <div class="import-footer" style="justify-content:flex-end">
      <span class="import-setting">导入设置：
        <span class="el-select" data-options="新增模式：导入时系统自动生成产品编号，不受表格填写影响">
          <span class="el-input__wrapper"><input class="el-input__inner" value="新增模式：导入时系统自动生成产品编号，不受表格填写影响" readonly/><span class="el-select__caret">▾</span></span>
        </span>
      </span>
      <span class="footer-actions">
        <button class="el-button" id="btnClosePage">关闭页面</button>
        <button class="el-button el-button--primary" id="btnConfirmImport">确认导入</button>
      </span>
    </div>

  </div>
</div>

<script>window.DYJ_ROOT = '../../';</script>
<script src="../../组件/app.js"></script>
<script>
DYJ.mountShell({ active: '产品资料', tab: { name: '导入产品', path: location.href.replace(/\\/g,'/') } });
DYJ.bindSelects();
DYJ.bindClose();
document.getElementById('btnClosePage').addEventListener('click', () => {
  // 现网为独立页签：关闭后回到产品资料
  location.href = 'index.html';
});
document.getElementById('btnConfirmImport').addEventListener('click', () => {
  DYJ.toast('演示原型：未选择文件，不执行真实导入');
});
document.getElementById('impDownload').addEventListener('click', () => DYJ.toast('已下载导入模板（演示）'));
document.getElementById('impUpload').addEventListener('click', () => DYJ.toast('请选择 Excel（演示，不解析文件）'));
document.getElementById('impDel').addEventListener('click', () => DYJ.toast('请先勾选数据', 'warning'));
document.getElementById('impEdit').addEventListener('click', () => DYJ.toast('请先勾选数据', 'warning'));
document.getElementById('impDiscount').addEventListener('click', () => DYJ.toast('已引用厂商采购折扣（演示）'));
document.getElementById('impRevert').addEventListener('click', () => DYJ.toast('已还原修改（演示）'));
document.getElementById('impErr').addEventListener('click', () => DYJ.toast('当前无错误记录（演示）'));
document.getElementById('impValidate').addEventListener('click', () => DYJ.toast('综合校验通过（演示，表为空）'));
</script>
</body>
</html>
