<!--
  片段 10 · 确认框（MessageBox，删除二次确认）
  权威：2026-09-10 现网实测。依赖 ../app.css；运行时由 DYJ.confirmBox({title,content,okText,type}) 动态创建。
  - 无图标；标题/正文均居中；正文灰色；按钮居中，取消为白底，危险操作确定为红色实心（el-button--danger）。
  - 原型用法：
      const ok = await DYJ.confirmBox({ title: '您确定要删除吗？',
        content: '此操作将会删除 <b class="text-danger">1</b> 条产品数据', okText: '确定', type: 'danger' });
      if (!ok) return; // 用户取消
-->
<div class="msgbox-mask is-show">
  <div class="el-message-box">
    <div class="el-message-box__title">您确定要删除吗？</div>
    <div class="el-message-box__content">此操作将会删除 <b class="text-danger">1</b> 条产品数据</div>
    <div class="el-message-box__btns">
      <button class="el-button">取消</button>
      <button class="el-button el-button--danger">确定</button>
    </div>
  </div>
</div>
