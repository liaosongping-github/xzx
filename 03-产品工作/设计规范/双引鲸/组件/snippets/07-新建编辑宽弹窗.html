<!--
  片段 07 · 新建/编辑产品资料宽弹窗
  权威：2026-09-10 现网实测（宽 1400px、近全屏、左侧 7 锚点 + 右侧三列栅格表单）。
  依赖 ../app.css；打开 DYJ.openDialog('productDialog')。
  结构要点：
  - 头部：× 在标题左侧（is-left），无右侧关闭；
  - 左锚点：基础信息/产品参数/产品图片/产品属性/产品条码信息/其他信息/厂商信息，点击平滑滚动定位；
  - 三列栅格 .dialog-grid，label 102px 不换行；必填红星；只读灰底字段（产品编号保存后自动生成、厂商名称带出）；
  - 中英文对照输入：中文输入 + 英文输入 + 翻译图标按钮（无边框主色 SVG，禁止文字/emoji）；
  - 规格：0 × 0 × 0 cm；重量 A / B kg；内盒/外箱装量 A / B pcs；
  - 其他信息：热销/实样/停产/GCC 复选；是否下架单选（默认否）；6 个整行 textarea；
  - 产品图片/视频：虚线上传框；产品属性为空时显示自定义添加区；
  - 底部固定：保存草稿 / 关闭 / 确定；确定做必填校验并定位到第一个空项 + toast。
  全字段以现网采集 output/cap5-newDialog.json 为准。
-->
<div class="overlay-mask" id="productDialog">
  <div class="el-dialog is-wide">
    <div class="el-dialog__header is-wide-header">
      <button class="el-dialog__close is-left" data-close-dialog="productDialog">×</button>
      <span>新建产品资料</span>
    </div>
    <div class="dialog-anchor-layout">
      <nav class="dialog-anchor">
        <div class="dialog-anchor__item is-active" data-sec="sec-base">基础信息</div>
        <div class="dialog-anchor__item" data-sec="sec-param">产品参数</div>
        <div class="dialog-anchor__item" data-sec="sec-img">产品图片</div>
        <div class="dialog-anchor__item" data-sec="sec-attr">产品属性</div>
        <div class="dialog-anchor__item" data-sec="sec-barcode">产品条码信息</div>
        <div class="dialog-anchor__item" data-sec="sec-other">其他信息</div>
        <div class="dialog-anchor__item" data-sec="sec-manu">厂商信息</div>
      </nav>
      <div class="dialog-anchor-body" id="pdBody">
        <div class="dialog-grid" id="pdForm">

          <div class="form-section-title" id="sec-base">基础信息：</div>
          <div class="el-form-item is-required"><label class="el-form-item__label">产品编号：</label><div class="el-form-item__content"><span class="el-input__wrapper is-disabled"><input class="el-input__inner" value="保存后自动生成" readonly/></span></div></div>
          <div class="el-form-item is-required"><label class="el-form-item__label">出厂货号：</label><div class="el-form-item__content"><span class="el-input__wrapper"><input class="el-input__inner" placeholder="请输入"/></span></div></div>
          <div class="el-form-item"><label class="el-form-item__label">辅助编号：</label><div class="el-form-item__content"><span class="el-input__wrapper"><input class="el-input__inner" placeholder="请输入"/></span></div></div>
          <div class="el-form-item is-required"><label class="el-form-item__label">产品名称：</label><div class="el-form-item__content"><span class="el-input__wrapper"><input class="el-input__inner" placeholder="请输入"/></span></div></div>
          <div class="el-form-item"><label class="el-form-item__label">英文名称：</label><div class="el-form-item__content">
            <span class="dual-input"><span class="el-input__wrapper"><input class="el-input__inner" placeholder="请输入"/></span><button type="button" class="trans-btn" title="英文翻译"><!--翻译 SVG--></button></span>
          </div></div>
          <div class="el-form-item is-required"><label class="el-form-item__label">产品分类：</label><div class="el-form-item__content"><span class="el-select" data-options="请选择"><span class="el-input__wrapper"><input class="el-input__inner" placeholder="请选择" readonly/><span class="el-select__caret">▾</span></span></span></div></div>
          <div class="el-form-item is-required"><label class="el-form-item__label">出厂价：</label><div class="el-form-item__content"><span class="el-input__wrapper"><input class="el-input__inner" placeholder="请输入"/></span></div></div>
          <div class="el-form-item is-required"><label class="el-form-item__label">进货价：</label><div class="el-form-item__content"><span class="el-input__wrapper"><input class="el-input__inner" placeholder="请输入"/></span></div></div>
          <div class="el-form-item"><label class="el-form-item__label">采购折扣：</label><div class="el-form-item__content"><span class="el-input__wrapper"><input class="el-input__inner"/><span class="input-suffix">%</span></span></div></div>

          <div class="form-section-title" id="sec-param">产品参数：</div>
          <div class="el-form-item is-required"><label class="el-form-item__label">内盒/*外箱装量：</label><div class="el-form-item__content">
            <span class="dual-input"><span class="el-input__wrapper"><input class="el-input__inner" value="0"/></span><span class="dual-sep">/</span><span class="el-input__wrapper"><input class="el-input__inner" value="0"/></span><span class="dual-unit">pcs</span></span>
          </div></div>
          <div class="el-form-item is-required"><label class="el-form-item__label">包装方式：</label><div class="el-form-item__content">
            <span class="dual-input"><span class="el-input__wrapper"><input class="el-input__inner" placeholder="请输入"/></span><span class="el-input__wrapper"><input class="el-input__inner" placeholder="英文包装"/></span><button type="button" class="trans-btn"><!--译--></button></span>
          </div></div>
          <div class="el-form-item is-required"><label class="el-form-item__label">外箱规格：</label><div class="el-form-item__content">
            <span class="triple-size"><span class="el-input__wrapper"><input class="el-input__inner" value="0"/></span><span class="ts-x">×</span><span class="el-input__wrapper"><input class="el-input__inner" value="0"/></span><span class="ts-x">×</span><span class="el-input__wrapper"><input class="el-input__inner" value="0"/></span><span class="unit-text">cm</span></span>
          </div></div>
          <!-- 产品规格/内盒规格/包装规格同 triple-size；外箱毛/净重、产品毛/净重为 A / B kg；体积/材积 A / B cbm/cuft -->

          <div class="form-section-title" id="sec-img">产品图片：</div>
          <div class="el-form-item is-block"><label class="el-form-item__label">图片信息：</label><div class="el-form-item__content"><div class="upload-box">＋</div></div></div>
          <div class="el-form-item is-block"><label class="el-form-item__label">产品视频：</label><div class="el-form-item__content"><div class="upload-box">＋</div></div></div>

          <div class="form-section-title" id="sec-other">其他信息：</div>
          <div class="el-form-item"><label class="el-form-item__label">其他：</label><div class="el-form-item__content">
            <span class="check-line"><label><input type="checkbox"/>热销</label><label><input type="checkbox"/>实样</label><label><input type="checkbox"/>停产</label><label><input type="checkbox"/>GCC</label></span>
          </div></div>
          <div class="el-form-item"><label class="el-form-item__label">是否下架：</label><div class="el-form-item__content">
            <span class="radio-line"><label><input type="radio" name="offShelf"/>是</label><label><input type="radio" name="offShelf" checked/>否</label></span>
          </div></div>
          <div class="el-form-item"></div>
          <!-- 报关中文/中文备注/英文备注/注意事项/功能说明/客户备注：整行 textarea（is-block，跨三列） -->
          <div class="el-form-item is-block"><label class="el-form-item__label">中文备注：</label><div class="el-form-item__content"><textarea class="el-textarea" placeholder="请输入"></textarea></div></div>

          <div class="form-section-title" id="sec-manu">厂商信息：</div>
          <div class="el-form-item is-required"><label class="el-form-item__label">厂商编号：</label><div class="el-form-item__content"><span class="el-select" data-options="请选择"><span class="el-input__wrapper"><input class="el-input__inner" placeholder="选择基础信息厂商后带出" readonly/><span class="el-select__caret">▾</span></span></span></div></div>
          <div class="el-form-item"><label class="el-form-item__label">厂商名称：</label><div class="el-form-item__content"><span class="el-input__wrapper is-disabled"><input class="el-input__inner" readonly/></span></div></div>
        </div>
      </div>
    </div>
    <div class="el-dialog__footer">
      <button class="el-button">保存草稿</button>
      <button class="el-button" data-close-dialog="productDialog">关闭</button>
      <button class="el-button el-button--primary">确定</button>
    </div>
  </div>
</div>
