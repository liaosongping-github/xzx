<!-- 列设置抽屉。默认隐藏，点工具栏「列」打开。宽约 514px。 -->
<div class="dyj-drawer-mask dyj-hidden" data-dyj-drawer="column-drawer">
  <aside class="dyj-drawer is-md" onclick="event.stopPropagation()">
    <div class="dyj-drawer-header">
      <span>勾选您要显示的字段</span>
      <button type="button" class="dyj-btn dyj-btn-text" data-dyj-close>×</button>
    </div>
    <div class="dyj-drawer-body">
      <div class="dyj-drawer-tools">
        <button type="button" class="dyj-btn">设置全部显示</button>
        <button type="button" class="dyj-btn">排序整理</button>
        <button type="button" class="dyj-btn">恢复系统默认</button>
      </div>
      <div class="dyj-column-search">
        <input class="dyj-input" placeholder="查询字段">
        <button type="button" class="dyj-btn dyj-btn-primary">查询</button>
      </div>
      <div class="dyj-column-list">
        <!-- SLOT:fields 来自字段字典列表可显列 -->
        <label class="dyj-column-item"><input type="checkbox" checked> 报价编号</label>
        <label class="dyj-column-item"><input type="checkbox" checked> 客户编号</label>
        <label class="dyj-column-item"><input type="checkbox" checked> 客户名称</label>
        <label class="dyj-column-item"><input type="checkbox"> 辅助单号</label>
        <label class="dyj-column-item"><input type="checkbox" checked> 订单状态</label>
        <label class="dyj-column-item"><input type="checkbox"> 付款方式</label>
        <label class="dyj-column-item"><input type="checkbox"> 业务员</label>
      </div>
    </div>
    <div class="dyj-drawer-footer">
      <button type="button" class="dyj-btn" data-dyj-close>关闭</button>
      <button type="button" class="dyj-btn dyj-btn-primary" data-dyj-close>保存</button>
    </div>
  </aside>
</div>
